name: Daily rebase & Docker publish

on:
  schedule:
    - cron: "17 4 * * *" # daily 04:17 UTC
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-rebase-build
  cancel-in-progress: false

jobs:
  rebase-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Rebase onto upstream main
        run: |
          git config user.name "openclaw-bot"
          git config user.email "noreply@users.noreply.github.com"
          git remote add upstream https://github.com/bilawalsidhu/gods-eye-view.git
          git fetch upstream main
          if [ "$(git rev-parse HEAD)" = "$(git rev-parse upstream/main)" ]; then
            echo "Already up to date."
          else
            git rebase upstream/main
            git push --force-with-lease origin main
          fi

      - name: Docker meta
        id: meta
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            remyquartermaster/gods-eye-view:latest
            remyquartermaster/gods-eye-view:${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
